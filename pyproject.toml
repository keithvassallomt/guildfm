[project]
name = "guildfm"
version = "0.1.0"
description = "Office music, voted on by everyone."
authors = [
    { name = "Keith Vassallo", email = "keith@vassallo.cloud" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.15.0",
    "soco>=0.31.5",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
guildfm = "guildfm:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["web", "prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# A split string reads better than a long list literal for word lists.
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
