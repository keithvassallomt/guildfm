<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1512" />
    <meta
      name="description"
      content="Pick what plays in the office. Request songs, vote on the queue, and hear your name on air."
    />
    <!-- Link previews in chats. GuildFM fills in its own address where these start with the
         placeholder, since previews need the picture's full address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GuildFM" />
    <meta property="og:title" content="GuildFM, the office jukebox" />
    <meta
      property="og:description"
      content="Pick what plays in the office. Request songs, vote on the queue, and hear your name on air."
    />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:image" content="__ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The GuildFM logo above a radio dial, with its needle on air" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installing it as an app: the manifest for most browsers, and these for iPhones. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GuildFM" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>GuildFM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
